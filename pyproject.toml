[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aste-quantule-mapper"
version = "4.0.0"
description = "Advanced Statistical Tensor Engine with Quantule Mapping"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "h5py>=3.8.0",
    "filelock>=3.12.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "ripser>=0.6.3",
    "pydantic>=2.0.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=12.0.0", "mpi4py>=3.1.0"]
ui = ["pyvista>=0.43.0", "imageio>=2.31.0", "scikit-image>=0.21.0"]
dev = ["pytest>=7.2.0", "ruff>=0.1.0", "mypy>=1.0.0", "pip-tools>=7.0.0", "httpx>=0.24.0", "coverage>=7.0.0"]

[project.scripts]
aste-fss-analyzer = "plugins.tools.fss_scaling_analyzer:main"
aste-gif-pipeline = "plugins.visualizers.gif_pipeline_manager:main"
aste-visual-suite = "plugins.visualizers.visual_analysis_suite:main"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build", "node_modules", "simulation_data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "NPY"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]